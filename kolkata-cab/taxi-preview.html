<body>
  <canvas id="preview" aria-label="Professional studio render of the Kolkata Ambassador taxi"></canvas>
  <div class="topbar">
    <div class="title"><strong>KOLKATA CAB · AMBASSADOR</strong><span>STUDIO RENDER · PROCEDURAL MODEL · WB 04 BH 1189</span></div>
    <div class="stats" id="triangleCount">TRIANGLES · CALCULATING</div>
  </div>
  <nav class="views" aria-label="Taxi camera views">
    <button type="button" data-view="front">FRONT</button>
    <button type="button" data-view="rear">REAR</button>
    <button type="button" data-view="side">SIDE</button>
    <button type="button" data-view="follow">FOLLOW</button>
    <button type="button" data-view="threequarter" class="active">3/4</button>
  </nav>
  <script type="module">
    import * as THREE from 'three';
    import { createTaxi, updateTaxiWheels } from './src/vehicles.js';

    const canvas = document.querySelector('#preview');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(innerWidth, innerHeight, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();

    // Neutral studio background gradient
    const bgCanvas = document.createElement('canvas');
    bgCanvas.width = 512; bgCanvas.height = 512;
    const bgCtx = bgCanvas.getContext('2d');
    const bgGrad = bgCtx.createLinearGradient(0, 0, 0, 512);
    bgGrad.addColorStop(0, '#d9d8d4');
    bgGrad.addColorStop(0.5, '#c9c7c0');
    bgGrad.addColorStop(1, '#b7b4aa');
    bgCtx.fillStyle = bgGrad;
    bgCtx.fillRect(0, 0, 512, 512);
    scene.background = new THREE.CanvasTexture(bgCanvas);

    // Studio floor (y = 0 matches taxi wheel bottom)
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 80),
      new THREE.MeshStandardMaterial({ color: 0xdedad0, roughness: 0.22, metalness: 0.05 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    floor.receiveShadow = true;
    scene.add(floor);

    // Contact shadow texture
    const shadowCanvas = document.createElement('canvas');
    shadowCanvas.width = 512; shadowCanvas.height = 512;
    const shadowCtx = shadowCanvas.getContext('2d');
    const shadowGrad = shadowCtx.createRadialGradient(256, 256, 40, 256, 256, 220);
    shadowGrad.addColorStop(0, 'rgba(0,0,0,0.35)');
    shadowGrad.addColorStop(0.5, 'rgba(0,0,0,0.15)');
    shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    shadowCtx.fillStyle = shadowGrad;
    shadowCtx.fillRect(0, 0, 512, 512);
    const shadowPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(8, 8),
      new THREE.MeshBasicMaterial({
        map: new THREE.CanvasTexture(shadowCanvas),
        transparent: true,
        opacity: 0.85,
        depthWrite: false,
        toneMapped: false,
      })
    );
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.position.y = 0.004;
    scene.add(shadowPlane);

    // Three-point studio lighting
    const keyLight = new THREE.DirectionalLight(0xfff3e0, 3.2);
    keyLight.position.set(-5, 6, -4);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -8;
    keyLight.shadow.camera.right = 8;
    keyLight.shadow.camera.top = 8;
    keyLight.shadow.camera.bottom = -8;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 25;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xe0e8f0, 1.1);
    fillLight.position.set(5, 4, 4);
    scene.add(fillLight);

    const rimLight = new THREE.SpotLight(0xfff0d8, 6, 25, 0.45, 0.5, 1.2);
    rimLight.position.set(0, 5, 8);
    rimLight.target.position.set(0, 1, 0);
    rimLight.castShadow = false;
    scene.add(rimLight);
    scene.add(rimLight.target);

    scene.add(new THREE.AmbientLight(0xffffff, 0.25));

    // Procedural studio environment map
    const envCanvas = document.createElement('canvas');
    envCanvas.width = 256; envCanvas.height = 256;
    const envCtx = envCanvas.getContext('2d');
    const envGrad = envCtx.createLinearGradient(0, 0, 0, 256);
    envGrad.addColorStop(0, '#f0ece0');
    envGrad.addColorStop(0.2, '#e0dcc8');
    envGrad.addColorStop(0.5, '#c9c7bc');
    envGrad.addColorStop(0.8, '#b7b4a8');
    envGrad.addColorStop(1, '#a8a498');
    envCtx.fillStyle = envGrad;
    envCtx.fillRect(0, 0, 256, 256);
    const winGrad = envCtx.createRadialGradient(128, 190, 10, 128, 190, 90);
    winGrad.addColorStop(0, 'rgba(255,255,255,0.45)');
    winGrad.addColorStop(1, 'rgba(255,255,255,0)');
    envCtx.fillStyle = winGrad;
    envCtx.fillRect(30, 130, 196, 120);
    const envTexture = new THREE.CanvasTexture(envCanvas);
    envTexture.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = envTexture;
    scene.environmentIntensity = 1.0;

    const taxi = createTaxi();
    taxi.traverse((object) => {
      if (object.isMesh) { object.castShadow = true; object.receiveShadow = true; }
    });
    scene.add(taxi);

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 120);
    const target = new THREE.Vector3(0, 0.95, 0);
    const views = {
      front: new THREE.Vector3(0, 1.2, -8.6),
      rear: new THREE.Vector3(0, 1.2, 8.6),
      side: new THREE.Vector3(8.8, 1.3, 0),
      follow: new THREE.Vector3(0, 2.55, 6.2),
      threequarter: new THREE.Vector3(5.4, 2.8, -6.6),
    };

    let activeView = 'threequarter';
    let autoRotate = true;
    const wantedCamera = new THREE.Vector3().copy(views.threequarter);
    const wantedTarget = new THREE.Vector3(0, 0.95, 0);
    const worldAnchorPos = new THREE.Vector3();
    const worldLookPos = new THREE.Vector3();

    camera.position.copy(views.threequarter);

    document.querySelectorAll('[data-view]').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('[data-view]').forEach((item) => item.classList.toggle('active', item === button));
        activeView = button.dataset.view;
        autoRotate = activeView === 'threequarter';
        if (activeView !== 'follow') {
          wantedCamera.copy(views[activeView]);
          wantedTarget.set(0, 0.95, 0);
        }
      });
    });

    let triangles = 0;
    taxi.traverse((object) => {
      if (!object.isMesh || !object.geometry) return;
      const geometry = object.geometry;
      const count = geometry.index ? geometry.index.count : geometry.attributes.position.count;
      triangles += Math.floor(count / 3);
    });
    document.querySelector('#triangleCount').textContent = `TRIANGLES · ${triangles.toLocaleString()}`;

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(innerWidth, innerHeight, false);
    }
    window.addEventListener('resize', resize);

    const clock = new THREE.Clock();
    function frame() {
      const dt = Math.min(clock.getDelta(), 0.04);
      const elapsed = clock.elapsedTime;

      if (autoRotate) {
        taxi.rotation.y += dt * 0.18;
        updateTaxiWheels(taxi, dt, 0, 0);
      } else if (activeView === 'follow') {
        // Gentle cruise/weave preview for 3rd-person follow camera
        const cruiseSpeed = 8.5;
        const steerPreview = Math.sin(elapsed * 0.9) * 0.18;
        taxi.rotation.y = Math.sin(elapsed * 0.45) * 0.22;
        updateTaxiWheels(taxi, dt, cruiseSpeed, steerPreview);

        taxi.updateMatrixWorld(true);
        taxi.userData.riderFollowAnchor.getWorldPosition(worldAnchorPos);
        worldLookPos.set(0, 1.1, -2.5).applyMatrix4(taxi.matrixWorld);

        wantedCamera.copy(worldAnchorPos);
        wantedTarget.copy(worldLookPos);
      } else {
        taxi.rotation.y = THREE.MathUtils.lerp(taxi.rotation.y, 0, 1 - Math.exp(-6 * dt));
        updateTaxiWheels(taxi, dt, 0, 0);
      }

      camera.position.lerp(wantedCamera, 1 - Math.exp(-7 * dt));
      target.lerp(wantedTarget, 1 - Math.exp(-9 * dt));
      camera.lookAt(target);

      shadowPlane.position.x = taxi.position.x;
      shadowPlane.position.z = taxi.position.z;

      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
